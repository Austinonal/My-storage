name: Editor

on:
  push:
    branches: [claude/funny-hopper-fhu9fj, main]
    paths: ['editor/**', '.github/workflows/editor.yml']
  workflow_dispatch:

concurrency:
  group: editor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: editor

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: editor/dist

  pages:
    needs: web
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      # The native project is generated from the installed @capacitor/android version, not committed.
      - run: npx cap add android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: editor/android
      - name: Publish the APK as the editor-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk editor.apk
          gh release delete editor-latest --yes --cleanup-tag || true
          gh release create editor-latest editor.apk --prerelease --target "$GITHUB_SHA" \
            --title "Editor (latest build)" \
            --notes "Debug build of ${GITHUB_SHA::7}. Android 11 or newer. Your phone will ask to allow installs from this source."
      - uses: actions/upload-artifact@v4
        with:
          name: editor-apk
          path: editor/android/app/build/outputs/apk/debug/app-debug.apk
